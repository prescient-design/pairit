# Beam search inference-time compute configuration
#
# Maintains a global beam of B candidates. Each round, expands every beam
# member by K generations, applies V,I,N filtering, prunes back to B globally.
#
# To run:
#   pairit_beam_search model.ckpt_path=/path/to/checkpoint.ckpt

defaults:
  - _self_
  - data@datamodule: zinc_molecule_improvement

# RNG seed for reproducible inference (#37). Seeds torch/numpy/python-random at
# entry-point time via lightning.seed_everything, so per-SMILES output is stable
# across identical inputs. Override on the command line for seed-variation runs.
seed: 42

# Split to use for seed molecules
split: test

# Datamodule overrides
datamodule:
  keep_original_ordering: true

# Model configuration
model:
  _target_: pairit.model.PairITCLM2
  ckpt_path: ???  # Required
  run_name: ${extract_run_name:${model.ckpt_path}}
  extra_name: best_val
  model_name: CLM_68M
  max_length: 300
  transform_fn: ${datamodule.transform_fn}

# Generation parameters
generation:
  temperature: 0.5
  batch_size: 16

# Beam search specific parameters
beam_search:
  beam_width: 32               # B: total candidates maintained
  expansions_per_candidate: 8  # K: generations per beam member per round
  num_rounds: 5                # Number of expand-filter-prune cycles
  vin_hard_gate: true          # Require V,I,N for beam eligibility
  vin_fallback: valid_only     # Fallback: 'valid_only' | 'none'
  ranking_property: logp       # Property to rank by
  ranking_direction: increasing  # 'increasing' or 'decreasing'
  improvement_threshold: 0.5   # Improvement = gen > this value (for binary classifiers). null = marginal.
  allow_revisit: false         # Allow a molecule to re-enter the beam
  track_lineage: true          # Track full parent chain for trajectory analysis

# Seed extraction
seeds:
  max_seeds: null              # Limit seeds (null = all from split)
  deduplicate: true

# Reference SMILES for memorization checking
reference_smiles_files: []
smiles_column: smiles

# Properties to compute
properties:
  property_names:
    - logp
    - qed
    - sa

# Output
output:
  dir: ${oc.env:PAIRIT_OUTPUT_ROOT,./outputs}/${model.run_name}/beam_search/${model.extra_name}/${split}/${now:%Y-%m-%d_%H-%M-%S}

# Eval config overlay: set to an existing eval config name (e.g. "zinc_pair_evaluate")
# to inherit reference_smiles_files, property_names, ranking_property, temperature.
# Explicit values in this config take precedence.
eval_config: null

# Device
device: null
