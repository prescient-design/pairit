# Model evaluation configuration
# To run:

# pairit_eval model.model_path=path_to_your_checkpoint.ckpt

defaults:
  - _self_
  - data@datamodule: zinc_molecule_improvement
#  - model: clm2_smiles

datamodule:
  keep_original_ordering: true

output_dir: ${oc.env:PAIRIT_OUTPUT_ROOT,./outputs}/${model.run_name}/evaluation_results/${model.extra_name}/${split}/${now:%Y-%m-%d_%H-%M-%S}

split: test

# datamodule:
#   _target_: pairit.data._molecule_improvement_datamodule.MoleculeImprovementLightningDataModule
#   tokenizer_max_length: 1024 #8192 # shouldn't this come from elsewhere??

# Training info for computing datapoints seen (extracted from checkpoint + config)
training_batch_size: null  # Set to override datamodule.batch_size for datapoints calculation
training_accumulate_grad_batches: 1
training_num_devices: 1

# Optional wandb logging for evaluation results
wandb_project: null  # Set to enable wandb logging (e.g., "pairit")
wandb_entity: null

model:
  _target_: pairit.model.PairITCLM2 #pairit.model.UME # is model_name needed?
  run_name: zincpairs_manygpu_pretrained
  extra_name: last_ckpt # last_ckpt #
  ckpt_path: ${pairit_assets:checkpoints/pairit/zinc_pretrain/CLM_68M_logp_eps1.ckpt}
  model_name: CLM_68M
  max_length: 300 #512
  transform_fn: ${datamodule.transform_fn}
  # are other arguments needed? if not will use the defaults. e.g. use model_name?
  
  # DEPRECATED: mask_input_tokens, mask_first_molecule, mask_second_molecule, mask_rate
  # were removed from PairITCLM2. Conditional masking is now controlled by
  # conditional_loss_only in the model config. These params are kept for reference only.
  # mask_input_tokens: false
  # mask_first_molecule: false
  # mask_second_molecule: false
  # mask_rate: 0.15

callbacks:
  #- _target_: pairit.callbacks.FirstMoleculePerplexityCallback 
    # max_length: ${datamodule.tokenizer_max_length}
    # batch_size: 8
  
  - _target_: pairit.callbacks.MoleculeValidationCallback
    num_unconditional_generations: 0  # Number of molecules to generate for validity checking
    num_conditional_generations: 1e9  # Number of conditional molecules to generate (full validation set)
    save_dir: ${output_dir}/generated_molecules
    max_samples_to_save: 1e9  # Save all  generated samples
    reference_smiles_files:
      - name: bace_train
        path: ${pairit_assets:data/moleculenet/bace/train/molecules_bace.parquet}
        default: true
        # FOR SPEED; TO PUT BACK IN!
      - name: zinc_train
        path: ${pairit_assets:data/zinc/train/molecules.parquet}
    expensive_metrics_to_compute: ["memorization"] #["snn"] #$["snn"] #["snn", "fcd", "internal_diversity", "fragment_scaffold", "w1_kde"]
    temperature: 0.5 #0.95  # Sampling temperature for molecule generation
    save_pdfs: false  # Don't save PDFs (memory-intensive)
    num_generations_per_seed: 5 # 1  # Number of molecules to generate per conditioning molecule
    visualization_property_name: "logp"
    property_names: ["logp"]
    utility_key: logp # Property name used as utility during training
    #utility_direction: ${datamodule.utility_direction}  # Direction for utility improvement (increasing/decreasing)
    

  
