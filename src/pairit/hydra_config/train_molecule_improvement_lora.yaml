defaults:
  - _self_
  - data: molecule_improvement.yaml
  - model: clm2_smiles_lora.yaml
  - callbacks: lora_molecule_improvement.yaml
  - logger: wandb.yaml
  - trainer: default.yaml
  - setup: default.yaml
  - paths: default.yaml
  - lr_scheduler: default.yaml
  - plugins: null
  - experiment: null

dryrun: false
run_test: null
compile: false
seed: 42
preempt_friendly: false  # Enable preemption support - resume from latest checkpoint and sync with existing wandb run
weights_only: true  # If true, load only model weights from checkpoint, not optimizer state

# Logger configuration
logger:
  project: "molecule-improvement"
  name: "molecule-improvement-${model.model_name}"
  entity: null  # Set your wandb entity

# Paths
paths:
  root_dir: "first_run"
  output_dir: "${oc.env:PAIRIT_OUTPUT_ROOT,./outputs}/ignore" 