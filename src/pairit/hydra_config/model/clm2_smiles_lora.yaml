_target_: pairit.model.PairITCLM2

# this is basically the same as clm2_smiles.yaml, don't need both - JK num_validation_generations is different

# Model parameters
model_name: "CLM_68M"  # Paper default (Table 4): 12 layers, hidden 648,
                       # 12 heads, FFN 2048. The inference and eval configs
                       # assume this size, so changing it here means passing
                       # the same model_name to them too.
lr: 1e-4  # Lower learning rate for finetuning
max_length: 1024 #512
ckpt_path: null  # Path to pretrained model if available

use_lora: True
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1
target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

# Training parameters
num_training_steps: ${trainer.max_steps}
num_warmup_steps: 1000

# Tokenizer configuration - use SMILES tokenizer instead of protein tokenizer
tokenizer_dir: "smiles_tokenizer"  # SMILES tokenizer (see src/pairit/assets/smiles_tokenizer/)
transform_fn: ${data.transform_fn}

# Model-specific configuration parameters
model_kwargs:
  embedding_layer: linear_pos 
  hidden_act: gelu

# Scheduler-specific configuration parameters
scheduler_kwargs:
  # Any specific scheduler parameters would go here 
