# Evaluation config for single-molecule CLM (no paired generation)
# Only unconditional generation: sample from <cls>, check validity + novelty.

defaults:
  - _self_
  - data@datamodule: zinc_molecule_improvement

datamodule:
  keep_original_ordering: true

output_dir: ${oc.env:PAIRIT_OUTPUT_ROOT,./outputs}/${model.run_name}/evaluation_results/${model.extra_name}/${now:%Y-%m-%d_%H-%M-%S}

split: test

# Training info for computing datapoints seen
training_batch_size: null
training_accumulate_grad_batches: 1
training_num_devices: 1

model:
  _target_: pairit.model.PairITCLM2
  run_name: singlemol_eval
  extra_name: last_ckpt
  ckpt_path: null
  model_name: CLM_68M
  max_length: 300
  transform_fn: ${datamodule.transform_fn}

callbacks:
  - _target_: pairit.callbacks.MoleculeValidationCallback
    num_unconditional_generations: 500
    num_conditional_generations: 0  # No conditional (paired) generation
    save_generated_samples: true
    max_samples_to_save: 1e9
    save_dir: ${output_dir}/generated_molecules
    reference_smiles_files:
      - name: zinc_train
        path: ${pairit_assets:data/zinc/train/molecules.parquet}
        default: true
    expensive_metrics_to_compute: ["memorization"]
    temperature: 0.5
    save_pdfs: false
    property_names: ["logp"]
    utility_key: logp
