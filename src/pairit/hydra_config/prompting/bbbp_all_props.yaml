# @package data.prompting

defaults:
  - zinc_all_props
  - _self_

properties:
  # BBBP extends the ZINC "all props" set with a classification target.
  names: ["logp", "qed", "sa", "mw", "tpsa", "hbd", "hba", "rotatable_bonds", "frac_sp3_c", "p_np"]
  source:
    # Some BBBP parquets store p_np under a model/oracle prediction column.
    fallback_column_map: {p_np: "bbbp_b_oracle_pred"}

distance:
  source:
    # BBBP pairs files store similarity instead of distance.
    distance_column: "similarity"
    is_similarity: true
