# @package data.prompting

defaults:
  - zinc_all_props
  - _self_

properties:
  # HIV extends the ZINC "all props" set with a classification target.
  names: ["logp", "qed", "sa", "mw", "tpsa", "hbd", "hba", "rotatable_bonds", "frac_sp3_c", "HIV_active"]
  source:
    # Some HIV parquets store HIV_active under a model/oracle prediction column.
    fallback_column_map: {HIV_active: "hiv_b_oracle_pred"}

distance:
  source:
    # HIV pairs files store similarity instead of distance.
    distance_column: "similarity"
    is_similarity: true
