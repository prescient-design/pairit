[project]
name = "pairit"
readme = "README.md"
description = "PairIT: matched-pair SMILES generation for property-guided molecule optimization."
authors = [{name = "Prescient Design"}]
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch",
    "tqdm",
    "lightning",
    "torchmetrics",
    "universal_pathlib",
    "pandas",
    "numpy",
    "scipy",
    "joblib",
    "pyyaml",
    "omegaconf",
    # Imported at module level by the validation callback, so it has to be a
    # direct dependency rather than a transitive one.
    "matplotlib",
    "pyarrow>=20,<25",
    "s3fs[boto3]",
    "boto3",
    "wandb",
    "hydra-core",
    "datasets>=3.6,<4",
    "tokenizers",
    "transformers>=4.24.0",
    # Bundled MoleculeNet / TDC RF oracles were pickled with scikit-learn 1.7 --
    # loading a joblib in a materially different sklearn release raises
    # ``InconsistentVersionWarning`` and can silently return wrong probabilities.
    "scikit-learn>=1.7,<1.8",
    "python-dotenv",
    "peft",
    "einops",
    "rdkit>=2024.9.4",
    "beignet[datasets]>=0.0.13",
    "pair-gen",
    "atomic-datasets",
]

[build-system]
requires = ["setuptools >= 65"]
build-backend = 'setuptools.build_meta'

[project.scripts]
pairit_train = "pairit.cmdline:train"
pairit_eval = "pairit.cmdline:evaluate"
pairit_iterative_gen = "pairit.cmdline:iterative_generate"
pairit_best_of_n = "pairit.inference.best_of_n:main"
pairit_beam_search = "pairit.inference.beam_search:main"
pairit_refilter = "pairit.inference.refilter:main"

[project.optional-dependencies]
flash = [
    "flash-attn>=2.8.0.post2; sys_platform == 'linux'",
    "rotary-embedding-torch",
]
trl = [
    "trl",
    "accelerate",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pairit = ["*.txt", "*.json", "*.yaml"]
"pairit.assets" = ["**/*.txt", "**/*.json", "**/*.yaml"]
"pairit.hydra_config" = [ "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (training/eval smoke tests); deselected in CI with -m 'not slow'",
]

[tool.ruff]
line-length = 120
exclude = [
  "scripts",
  "notebooks",
  "examples",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B905",  # requires python >= 3.10
    "B007",  # unused-loop-control-variable
    "E741",  # ambiguous-variable-name
    "E902",  # file not found error
    "UP038",  # Use X | Y in isinstance call instead of (X, Y)
    "I001",  # Import block is un-sorted or un-formatted
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # MODULE IMPORTED BUT UNUSED
]
"tests/**/*.py" = [
  "D"
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
no-build-isolation-package = ["flash-attn"]
constraint-dependencies = [
    "torch>=2.0.0; extra != 'flash'",
    "torch==2.7.0; extra == 'flash'"
] # flash-attn wheels available

[tool.uv.sources]
pair-gen = { path = "pair_gen", editable = true }

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.0"
requires-dist = ["torch", "einops"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.14.1",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.1",
]

[[tool.uv.index]]
url = "https://pypi.python.org/simple"
